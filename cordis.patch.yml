# Keep the official Workspace available when this bundle remains installed but
# its replacement entry (or an owning group) is disabled. Provider selection is
# evaluated by the Loader; restart DSH after changing the plugin's enabled state.

- id: ui-workspace
  name: '@deepseek-ai/dsh-client-ui-workspace'
  disabled: !!js "!!get('worktreeWorkspaceProvider') && [...loader.entries()].some(entry => entry.options?.name === 'dsh-git-worktree' && !entry.disabled)"

- insert:
    - id: dsh-git-worktree
      name: dsh-git-worktree
