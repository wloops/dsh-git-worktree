# Replace the official ui-workspace loader row while this plugin is enabled.
# The Client bundle derives that exact version's official Browser, Picker,
# locale, stores, and directory-flow declarations, wrapping only the Browser.

- id: ui-workspace
  name: '@deepseek-ai/dsh-client-ui-workspace'
  disabled: true

- insert:
    - id: dsh-git-worktree
      name: dsh-git-worktree
